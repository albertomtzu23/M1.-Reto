# Integración continua: valida cada push y cada Pull Request.
# Es la evidencia de que las pruebas y el linter pasan con pytest y ruff reales.
name: CI

on:
  push:
  pull_request:

jobs:
  validar:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Pruebas (pytest)
        run: |
          set -o pipefail
          pytest -v | tee pytest.log
          echo "::notice title=pytest (Python ${{ matrix.python-version }})::$(tail -n 1 pytest.log)"

      - name: Linter (ruff)
        run: |
          set -o pipefail
          ruff check src | tee ruff.log
          echo "::notice title=ruff (Python ${{ matrix.python-version }})::$(tail -n 1 ruff.log)"

      - name: Tipos (mypy --strict, verificación adicional)
        run: |
          set -o pipefail
          pip install mypy
          mypy --strict src | tee mypy.log
          echo "::notice title=mypy (Python ${{ matrix.python-version }})::$(tail -n 1 mypy.log)"

      - name: Resumen del job
        run: |
          {
            echo "### Python ${{ matrix.python-version }}"
            echo '```'
            tail -n 1 pytest.log
            tail -n 1 ruff.log
            tail -n 1 mypy.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
